<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KITHBOUND</title>
<style>
  :root { --bg:#101218; --fg:#e8e8ee; --dim:#9aa0ad; --accent:#d8433a; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; overflow:hidden; }
  #wrap { display:flex; flex-direction:column; height:100%; }
  #game { flex:1; min-height:0; }
  #bar { padding:6px 12px; color:var(--dim); font-size:12px; display:flex; gap:6px 16px; flex-wrap:wrap; align-items:center; }
  #bar b { color:var(--fg); font-weight:600; }
  #bar a { color:var(--dim); }
  #bar a.ver { padding:2px 10px; border:1px solid #3a3f4d; border-radius:10px; text-decoration:none; }
  #bar a.ver.on { color:#fff; border-color:var(--accent); background:var(--accent); }
  @media (max-width: 640px) { #keys { display:none; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="game"></div>
  <div id="bar">
    <span><b>KITHBOUND</b>: an original RPG built on the pret/pokered disassembly. Every creature, map, tune and word is new
      (<a href="https://github.com/andrewnakas/pokered-cleanroom" target="_blank" rel="noopener">source</a> · <a href="THIRD_PARTY.md" target="_blank" rel="noopener">third-party notices</a>)</span>
    <span><a class="ver" id="vdawn" href="?v=dawn">Dawn</a> <a class="ver" id="vdusk" href="?v=dusk">Dusk</a></span>
    <span id="keys">Keys: <b>Arrows</b> move · <b>X</b> A · <b>Z</b> B · <b>Enter</b> Start · <b>Shift</b> Select. Gamepads and touch work too. Saving in the game is kept in this browser.</span>
  </div>
</div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const dusk = q.get("v") === "dusk" || q.get("v") === "blue";      // ?v=blue kept for old links
  document.getElementById(dusk ? "vdusk" : "vdawn").classList.add("on");
  if (dusk) document.documentElement.style.setProperty("--accent", "#3a66d8");
  // libretro joypad ids: 0 B, 2 Select, 3 Start, 4 Up, 5 Down, 6 Left, 7 Right, 8 A
  const k = (v, g) => ({ value: v, value2: g || "" });
  const P1 = {
    0: k("z", "BUTTON_1"), 8: k("x", "BUTTON_2"), 2: k("shift", "SELECT"), 3: k("enter", "START"),
    4: k("up arrow", "DPAD_UP"), 5: k("down arrow", "DPAD_DOWN"),
    6: k("left arrow", "DPAD_LEFT"), 7: k("right arrow", "DPAD_RIGHT"),
  };
  window.EJS_player = "#game";
  window.EJS_core = "gb";
  window.EJS_gameName = dusk ? "kithbound-dusk" : "kithbound-dawn";
  window.EJS_gameUrl = dusk ? "kithbound-dusk.gbc" : "kithbound-dawn.gbc";
  window.EJS_pathtodata = "data/";
  window.EJS_startOnLoaded = !!q.get("autostart");   // otherwise one tap starts game and sound
  window.EJS_disableDatabases = true;
  window.EJS_threads = false;
  window.EJS_color = dusk ? "#3a66d8" : "#d8433a";
  window.EJS_backgroundColor = "#101218";
  window.EJS_defaultControls = { 0: P1, 1: {}, 2: {}, 3: {} };
  // the cartridge title no longer selects a built-in colour set: pick one per version
  window.EJS_defaultOptions = { "gambatte_gb_colorization": "internal",
    "gambatte_gb_internal_palette": dusk ? "GBC - Dark Blue" : "GBC - Orange", "save-state-location": "browser" };
  window.EJS_onGameStart = function () { console.log("GB: game started"); };
})();
</script>
<script src="data/loader.js"></script>
</body>
</html>
